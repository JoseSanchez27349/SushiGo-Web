<section class="py-16 container mx-auto px-6 max-w-lg">
  <h1 class="text-4xl font-bold text-center mb-8 text-gray-800">Reservaciones y Contacto</h1>
  
  <form class="bg-white shadow-lg rounded-lg px-8 pt-6 pb-8 mb-4">
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="nombre">Nombre</label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-red-500" id="nombre" type="text" placeholder="Tu nombre">
    </div>
    <div class="mb-4">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="email">Email</label>
      <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-red-500" id="email" type="email" placeholder="tu@email.com">
    </div>
    <div class="mb-6">
      <label class="block text-gray-700 text-sm font-bold mb-2" for="mensaje">Mensaje o Reserva</label>
      <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-red-500" id="mensaje" rows="4" placeholder="¿Para cuántas personas y qué día?"></textarea>
    </div>
    <div class="flex items-center justify-between">
      <button class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition" type="button">
        Enviar Mensaje
      </button>
    </div>
  </form>
</section>
