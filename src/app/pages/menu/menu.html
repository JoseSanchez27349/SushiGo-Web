<section class="py-16 container mx-auto px-6">
  <h1 class="text-4xl font-bold text-center mb-4 text-gray-800">Nuestro Menú</h1>
  <p class="text-center text-gray-500 mb-12">Fusión de sabores, pasión por la comida.</p>

  <div class="grid md:grid-cols-2 gap-6 max-w-4xl mx-auto">
    <!-- Iteramos sobre los platillos -->
    <div *ngFor="let platillo of platillos" class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition">
      <div>
        <div class="flex justify-between items-start mb-2">
          <h2 class="text-xl font-bold text-gray-800">{{ platillo.nombre }}</h2>
          <span class="bg-red-100 text-red-800 text-xs font-semibold px-2 py-1 rounded">{{ platillo.categoria }}</span>
        </div>
        <p class="text-gray-600 text-sm mb-4">{{ platillo.desc }}</p>
      </div>
      <div class="text-right">
        <span class="text-2xl font-bold text-red-600">${{ platillo.precio }}</span>
      </div>
    </div>
  </div>
</section>
