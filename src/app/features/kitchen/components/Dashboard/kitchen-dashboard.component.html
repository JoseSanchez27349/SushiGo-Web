<div class="min-h-screen bg-[#0d0d0d] text-white flex flex-col font-sans select-none">
  <!-- Navbar Cocina KDS -->
  <header class="bg-[#181818] border-b border-zinc-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 bg-amber-600 rounded-xl flex items-center justify-center font-black text-lg shadow-md shadow-amber-900/30">
        👨‍🍳
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide">SushiGo — Sistema de Cocina (KDS)</h1>
        <p class="text-xs text-zinc-400">Comandas & Tickets Activos</p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <span class="text-sm font-medium text-zinc-300">Cocinero: {{ user()?.nombre }}</span>
      <button 
        (click)="onLogout()" 
        class="bg-[#222222] hover:bg-red-950/40 text-zinc-300 hover:text-red-400 border border-zinc-800 text-xs px-3 py-2 rounded-xl transition-all active:scale-95">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="flex-1 p-6 flex items-center justify-center">
    <div class="bg-[#181818] border border-zinc-800 rounded-3xl p-8 max-w-lg w-full text-center shadow-2xl">
      <div class="w-16 h-16 bg-amber-950/40 border border-amber-500/30 text-amber-500 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
        🔥
      </div>
      <h2 class="text-2xl font-bold mb-2">Pantalla de Cocina (KDS)</h2>
      <p class="text-sm text-zinc-400">Aquí se mostrarán las comandas en tiempo real enviadas desde la terminal del mesero.</p>
    </div>
  </main>
</div>
