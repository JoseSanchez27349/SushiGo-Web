<div class="min-h-dvh w-full bg-app text-main flex flex-col justify-center items-center p-4 font-sans select-none relative">
  
  <!-- Botón minimalista de Tema (Sol / Luna) -->
  <button 
    type="button"
    (click)="themeService.toggleTheme()"
    title="Cambiar tema"
    class="fixed top-4 right-4 z-40 w-9 h-9 rounded-full bg-card hover:bg-hover text-main text-sm border border-line flex items-center justify-center transition-all active:scale-95">
    {{ themeService.isLight() ? '🌙' : '☀️' }}
  </button>

  <!-- Contenedor Central Minimalista -->
  <div class="w-full max-w-sm bg-card border border-line rounded-3xl p-6 sm:p-7 shadow-xl space-y-5">
    
    <!-- Identidad con Logo -->
    <div class="text-center space-y-1">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-white border border-line p-1.5 shadow-xs flex items-center justify-center overflow-hidden mb-2">
        <img 
          src="logo-sushigo.jpeg" 
          alt="Logo SushiGo" 
          class="w-full h-full object-contain" />
      </div>
      <h1 class="text-lg font-bold tracking-tight text-main">SushiGo</h1>
      <p class="text-xs text-muted">
        {{ isAdminView() ? 'Acceso administrativo' : 'Ingresa tu código y PIN de acceso' }}
      </p>
    </div>

    <!-- Switch sutil Personal / Administrador -->
    <div class="grid grid-cols-2 p-1 bg-input border border-line rounded-xl text-xs font-semibold">
      <button 
        type="button"
        (click)="isAdminView() && toggleAdminView()"
        class="py-1.5 rounded-lg transition-all"
        [ngClass]="!isAdminView() ? 'bg-card text-main shadow-2xs border border-line/60' : 'text-muted hover:text-main'">
        Personal
      </button>
      <button 
        type="button"
        (click)="!isAdminView() && toggleAdminView()"
        class="py-1.5 rounded-lg transition-all"
        [ngClass]="isAdminView() ? 'bg-card text-main shadow-2xs border border-line/60' : 'text-muted hover:text-main'">
        Administrador
      </button>
    </div>

    <!-- Alerta de Error Minimalista -->
    @if (errorMessage()) {
      <div class="bg-brand/10 border border-brand/30 text-brand px-3 py-2 rounded-xl text-center text-xs font-medium">
        {{ errorMessage() }}
      </div>
    }

    <!-- ==================== VISTA 1: PERSONAL ==================== -->
    @if (!isAdminView()) {
      <form (submit)="$event.preventDefault(); onEmployeeSubmit()" class="space-y-3.5 pt-1">
        <div>
          <label class="block text-[11px] font-semibold text-muted uppercase tracking-wider mb-1.5">
            Código de Empleado
          </label>
          <input 
            type="text" 
            maxlength="10"
            [(ngModel)]="employeeCode" 
            name="employeeCode"
            placeholder="Ej. 101 o EMP-01"
            autocomplete="off"
            class="w-full h-11 bg-input border border-line rounded-2xl px-3.5 text-main placeholder-muted/60 focus:outline-none focus:border-brand text-xs font-mono transition-colors" />
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-muted uppercase tracking-wider mb-1.5">
            PIN (4 dígitos)
          </label>
          <input 
            type="password" 
            inputmode="numeric"
            maxlength="4"
            [(ngModel)]="pin" 
            name="pin"
            placeholder="••••"
            class="w-full h-11 bg-input border border-line rounded-2xl px-3.5 text-main placeholder-muted/60 focus:outline-none focus:border-brand text-xs font-mono tracking-widest transition-colors" />
        </div>

        <button 
          type="submit"
          [disabled]="isLoading()"
          class="w-full h-11 bg-brand hover:bg-brand-hover active:scale-[0.99] disabled:opacity-50 text-white font-semibold text-sm rounded-2xl transition-all flex items-center justify-center mt-2 shadow-sm">
          @if (isLoading()) {
            <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          } @else {
            <span>Iniciar sesión</span>
          }
        </button>
      </form>
    }

    <!-- ==================== VISTA 2: ADMINISTRADOR ==================== -->
    @if (isAdminView()) {
      <form (submit)="$event.preventDefault(); onAdminSubmit()" class="space-y-3.5 pt-1">
        <div>
          <label class="block text-[11px] font-semibold text-muted uppercase tracking-wider mb-1.5">
            Correo
          </label>
          <input 
            type="email" 
            [(ngModel)]="adminEmail" 
            name="adminEmail"
            placeholder="admin@sushigo.com"
            class="w-full h-11 bg-input border border-line rounded-2xl px-3.5 text-main placeholder-muted/60 focus:outline-none focus:border-brand text-xs transition-colors" />
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-muted uppercase tracking-wider mb-1.5">
            Contraseña
          </label>
          <input 
            type="password" 
            [(ngModel)]="adminPassword" 
            name="adminPassword"
            placeholder="••••••••"
            class="w-full h-11 bg-input border border-line rounded-2xl px-3.5 text-main placeholder-muted/60 focus:outline-none focus:border-brand text-xs transition-colors" />
        </div>

        <button 
          type="submit"
          [disabled]="isLoading()"
          class="w-full h-11 bg-brand hover:bg-brand-hover active:scale-[0.99] disabled:opacity-50 text-white font-semibold text-sm rounded-2xl transition-all flex items-center justify-center mt-2 shadow-sm">
          @if (isLoading()) {
            <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          } @else {
            <span>Iniciar sesión</span>
          }
        </button>
      </form>
    }

  </div>

</div>
