@if (isPublicView) {
  <!-- Barra de Navegación -->
  <nav class="bg-card text-main border-b border-line shadow-sm">
    <div class="container mx-auto px-6 py-4 flex justify-between items-center">
      <a routerLink="/" class="text-3xl font-bold tracking-wider">
        Sushi<span class="text-brand">Go</span>
      </a>
      
      <div class="space-x-6 text-lg">
        <a routerLink="/" routerLinkActive="text-brand font-semibold" [routerLinkActiveOptions]="{exact: true}" class="hover:text-brand transition">Inicio</a>
        <a routerLink="/menu" routerLinkActive="text-brand font-semibold" class="hover:text-brand transition">Menú</a>
        <a routerLink="/contacto" routerLinkActive="text-brand font-semibold" class="hover:text-brand transition">Contacto</a>
      </div>
    </div>
  </nav>
}

<main [class]="router.url.includes('/login') 
  ? 'fixed inset-0 h-dvh w-full overflow-hidden bg-app text-main' 
  : (!isPublicView ? 'min-h-screen h-full bg-app text-main overflow-y-auto' : 'min-h-screen bg-app text-main')">
  <router-outlet></router-outlet>
</main>

@if (isPublicView) {
  <footer class="bg-card text-muted border-t border-line py-6 text-center">
    <p>&copy; 2026 SushiGo - Fusión México-Japón. Todos los derechos reservados.</p>
  </footer>
}
